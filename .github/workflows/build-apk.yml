name: Lisan Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools"        || true
          "$SDKMANAGER" --install "platforms;android-35"  || true
          "$SDKMANAGER" --install "build-tools;35.0.0"    || true

      - name: Extract Lisan project
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/lisan-src"
          ZIP="$(find . -maxdepth 3 -type f -name '*.zip' | head -n1)"
          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP found in repo"
            exit 1
          fi
          echo "ZIP: $ZIP"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/lisan-src"
          find "$RUNNER_TEMP/lisan-src" -maxdepth 3 -type d | head -50

      - name: Locate Android project
        id: locate
        run: |
          set -e
          GRADLEW="$(find "$RUNNER_TEMP/lisan-src" -type f -name gradlew | head -n1)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$PROJECT_DIR"

      - name: Patch root build.gradle.kts
        run: |
          set -e
          PROJECT_DIR="${{ steps.locate.outputs.PROJECT_DIR }}"
          ROOT_GRADLE="$PROJECT_DIR/build.gradle.kts"
          if [ ! -f "$ROOT_GRADLE" ]; then
            echo "::error::build.gradle.kts not found"
            exit 1
          fi
          if grep -q "LISAN_JVM_FIX" "$ROOT_GRADLE"; then
            echo "Patch already applied"
          else
            {
              echo ""
              echo "// LISAN_JVM_FIX"
              echo "subprojects {"
              echo "    afterEvaluate {"
              echo '        extensions.findByName("android")?.let { ext ->'
              echo "            try {"
              echo "                val base = ext as com.android.build.gradle.BaseExtension"
              echo "                base.compileOptions {"
              echo "                    sourceCompatibility = JavaVersion.VERSION_17"
              echo "                    targetCompatibility = JavaVersion.VERSION_17"
              echo "                }"
              echo "            } catch (_: Throwable) {}"
              echo "        }"
              echo "        tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {"
              echo "            compilerOptions {"
              echo "                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)"
              echo "            }"
              echo "        }"
              echo "    }"
              echo "}"
              echo "// END LISAN_JVM_FIX"
            } >> "$ROOT_GRADLE"
          fi
          tail -30 "$ROOT_GRADLE"

      - name: Make Gradle executable
        run: chmod +x "${{ steps.locate.outputs.PROJECT_DIR }}/gradlew"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        id: find_apk
        run: |
          set -e
          APK="$(find "${{ steps.locate.outputs.PROJECT_DIR }}" -type f -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: Validate APK
        run: |
          set -e
          APK="${{ steps.find_apk.outputs.APK }}"
          SIZE="$(stat -c%s "$APK")"
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "::error::APK too small"
            exit 1
          fi
          file "$APK" | grep -qi "zip\|android" || { echo "::error::Invalid APK"; exit 1; }
          echo "APK validation passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lisan-debug-apk
          path: ${{ steps.find_apk.outputs.APK }}
          retention-days: 30
