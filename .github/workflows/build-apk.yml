name: Lisan Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" || true
          "$SDKMANAGER" --install "platforms;android-35" || true
          "$SDKMANAGER" --install "build-tools;35.0.0" || true

      - name: Extract Lisan project
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/lisan-src"
          ZIP="$(find . -maxdepth 3 -type f -name '*.zip' | head -n1)"
          [ -n "$ZIP" ] || { echo "::error::No ZIP found"; exit 1; }
          unzip -q "$ZIP" -d "$RUNNER_TEMP/lisan-src"

      - name: Locate Android project
        id: locate
        run: |
          set -e
          GRADLEW="$(find "$RUNNER_TEMP/lisan-src" -type f -name gradlew | head -n1)"
          [ -n "$GRADLEW" ] || { echo "::error::gradlew not found"; exit 1; }
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Patch project files
        run: |
          set -e
          PROJECT_DIR="${{ steps.locate.outputs.PROJECT_DIR }}"
          ROOT_GRADLE="$PROJECT_DIR/build.gradle.kts"
          if grep -q "LISAN_FIX" "$ROOT_GRADLE"; then
            echo "Gradle patch already applied"
          else
            echo "" >> "$ROOT_GRADLE"
            echo "// LISAN_FIX" >> "$ROOT_GRADLE"
            echo "subprojects {" >> "$ROOT_GRADLE"
            echo "    afterEvaluate {" >> "$ROOT_GRADLE"
            echo "        extensions.findByName(\"android\")?.let { ext ->" >> "$ROOT_GRADLE"
            echo "            try {" >> "$ROOT_GRADLE"
            echo "                val base = ext as com.android.build.gradle.BaseExtension" >> "$ROOT_GRADLE"
            echo "                base.compileOptions {" >> "$ROOT_GRADLE"
            echo "                    sourceCompatibility = JavaVersion.VERSION_17" >> "$ROOT_GRADLE"
            echo "                    targetCompatibility = JavaVersion.VERSION_17" >> "$ROOT_GRADLE"
            echo "                }" >> "$ROOT_GRADLE"
            echo "            } catch (_: Throwable) {}" >> "$ROOT_GRADLE"
            echo "        }" >> "$ROOT_GRADLE"
            echo "        tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {" >> "$ROOT_GRADLE"
            echo "            compilerOptions {" >> "$ROOT_GRADLE"
            echo "                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)" >> "$ROOT_GRADLE"
            echo "                allWarningsAsErrors.set(false)" >> "$ROOT_GRADLE"
            echo "                freeCompilerArgs.add(\"-opt-in=kotlin.RequiresOptIn\")" >> "$ROOT_GRADLE"
            echo "                freeCompilerArgs.add(\"-opt-in=androidx.compose.material3.ExperimentalMaterial3Api\")" >> "$ROOT_GRADLE"
            echo "                freeCompilerArgs.add(\"-opt-in=androidx.compose.ui.ExperimentalComposeUiApi\")" >> "$ROOT_GRADLE"
            echo "                freeCompilerArgs.add(\"-opt-in=androidx.compose.foundation.ExperimentalFoundationApi\")" >> "$ROOT_GRADLE"
            echo "            }" >> "$ROOT_GRADLE"
            echo "        }" >> "$ROOT_GRADLE"
            echo "    }" >> "$ROOT_GRADLE"
            echo "}" >> "$ROOT_GRADLE"
            echo "// END LISAN_FIX" >> "$ROOT_GRADLE"
          fi

          SETTINGS_FILE="$PROJECT_DIR/feature-settings/src/main/java/com/lisan/feature/settings/SettingsScreen.kt"
          if [ -f "$SETTINGS_FILE" ]; then
            if grep -q "androidx.compose.ui.platform.LocalLayoutDirection" "$SETTINGS_FILE"; then
              echo "Import already present"
            else
              sed -i '/^package /a import androidx.compose.ui.platform.LocalLayoutDirection' "$SETTINGS_FILE"
              echo "Import added"
            fi
          else
            echo "::warning::SettingsScreen.kt not found"
          fi

      - name: Make Gradle executable
        run: chmod +x "${{ steps.locate.outputs.PROJECT_DIR }}/gradlew"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        id: find_apk
        run: |
          set -e
          APK="$(find "${{ steps.locate.outputs.PROJECT_DIR }}" -type f -name '*.apk' | head -n1)"
          [ -n "$APK" ] || { echo "::error::No APK found"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lisan-debug-apk
          path: ${{ steps.find_apk.outputs.APK }}
          retention-days: 30
